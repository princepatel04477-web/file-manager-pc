[package]
name = "sift"
version = "0.1.0"
description = "A private, thoughtful file manager for Windows"
authors = ["Sift"]
edition = "2021"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
jwalk = "0.8"
rusqlite = { version = "0.32", features = ["bundled-full"] }
notify = "8"
blake3 = "1.8"
rayon = "1.11"
trash = "5"
sysinfo = "0.37"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
getrandom = "0.2"
mdns-sd = "0.13"
qrcode = "0.14"
flate2 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
